<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="StreamFusion: Android mirroring, wireless control and AI testing">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0b1a"/><stop offset="0.55" stop-color="#14123a"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2a5e"/><stop offset="1" stop-color="#14143a"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="0.6" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#6366f1" stop-opacity="0.55"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
    <style>
      .t{font-family:'Segoe UI',Inter,system-ui,-apple-system,Arial,sans-serif}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
      @keyframes float2{0%,100%{transform:translateY(0)}50%{transform:translateY(10px)}}
      @keyframes dash{to{stroke-dashoffset:-60}}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      @keyframes scan{0%{transform:translateY(0);opacity:0}15%{opacity:.9}85%{opacity:.9}100%{transform:translateY(250px);opacity:0}}
      @keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
      .phone{animation:float 6s ease-in-out infinite}
      .c1{animation:float2 5s ease-in-out infinite}
      .c2{animation:float 7s ease-in-out infinite}
      .c3{animation:float2 6.5s ease-in-out infinite}
      .link{stroke-dasharray:6 8;animation:dash 1.4s linear infinite}
      .dot{animation:pulse 2s ease-in-out infinite}
      .scan{animation:scan 3.2s ease-in-out infinite}
      .badge{animation:drift 5s ease-in-out infinite}
    </style>
  </defs>
  <rect width="1200" height="460" fill="url(#bg)"/>
  <g stroke="#6366f1" stroke-opacity="0.18" stroke-width="1" fill="none">
    <path d="M0 380 L1200 380 M0 400 L1200 400 M0 424 L1200 424 M0 452 L1200 452"/>
    <path d="M600 340 L-200 460 M600 340 L100 460 M600 340 L400 460 M600 340 L600 460 M600 340 L800 460 M600 340 L1100 460 M600 340 L1400 460"/>
  </g>
  <circle cx="900" cy="230" r="230" fill="url(#glow)"/>

  <g class="t">
    <text x="64" y="150" font-size="68" font-weight="800" fill="url(#brand)">StreamFusion</text>
    <text x="66" y="194" font-size="22" font-weight="600" fill="#e0e7ff">See your phone. Control it. Let AI test it.</text>
    <text x="66" y="230" font-size="16" fill="#a5b4fc">Android mirroring · wireless pairing · emulator studio · AI app + web testing</text>
    <g transform="translate(66,262)" font-size="13" font-weight="700">
      <rect width="96" height="30" rx="15" fill="#4f46e5"/><text x="48" y="20" text-anchor="middle" fill="#fff">Windows</text>
      <rect x="106" width="96" height="30" rx="15" fill="#312e81"/><text x="154" y="20" text-anchor="middle" fill="#c7d2fe">Open source</text>
      <rect x="212" width="70" height="30" rx="15" fill="#312e81"/><text x="247" y="20" text-anchor="middle" fill="#c7d2fe">MIT</text>
      <rect x="292" width="92" height="30" rx="15" fill="#312e81"/><text x="338" y="20" text-anchor="middle" fill="#c7d2fe">No cable</text>
    </g>
    <text x="66" y="338" font-size="13" fill="#818cf8">scrcpy · adb · Electron · React 19 · Claude</text>
  </g>

  <g fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round">
    <path class="link" d="M760 150 C700 150 690 200 700 230"/>
    <path class="link" d="M1010 250 C1060 250 1070 200 1060 170"/>
    <path class="link" d="M780 345 C720 345 700 300 706 270"/>
  </g>

  <g class="phone">
    <g transform="translate(790,60)">
      <ellipse cx="90" cy="372" rx="110" ry="14" fill="#000" opacity="0.4" filter="url(#soft)"/>
      <rect x="26" y="-16" width="170" height="340" rx="26" fill="#0d0d28"/>
      <polygon points="170,12 196,-4 196,306 170,334" fill="#0f0f2e"/>
      <polygon points="26,12 52,-4 196,-4 170,12" fill="#3b3b7a"/>
      <rect x="0" y="12" width="170" height="322" rx="26" fill="url(#face)" stroke="#6366f1" stroke-opacity="0.6"/>
      <rect x="10" y="26" width="150" height="294" rx="18" fill="url(#screen)"/>
      <rect x="62" y="32" width="46" height="9" rx="4.5" fill="#0b0b1a" opacity="0.85"/>
      <g class="t" font-size="11" fill="#fff" font-weight="700">
        <text x="24" y="70" font-size="13">StreamFusion</text>
        <rect x="24" y="82" width="122" height="40" rx="10" fill="#fff" opacity="0.18"/>
        <rect x="24" y="130" width="58" height="58" rx="12" fill="#fff" opacity="0.18"/>
        <rect x="88" y="130" width="58" height="58" rx="12" fill="#fff" opacity="0.28"/>
        <rect x="24" y="196" width="122" height="14" rx="7" fill="#fff" opacity="0.22"/>
        <rect x="24" y="218" width="84" height="14" rx="7" fill="#fff" opacity="0.22"/>
        <circle cx="52" cy="159" r="9" fill="#fff" opacity="0.7"/><circle cx="117" cy="159" r="9" fill="#fff" opacity="0.8"/>
      </g>
      <rect class="scan" x="10" y="40" width="150" height="3" fill="#fff" opacity="0.9"/>
      <rect x="40" y="300" width="90" height="5" rx="2.5" fill="#fff" opacity="0.7"/>
    </g>
  </g>

  <g class="t" font-size="12" font-weight="700">
    <g class="c1"><g transform="translate(666,92)">
      <rect width="130" height="54" rx="12" fill="#1e1b4b" stroke="#818cf8" stroke-opacity="0.7"/>
      <circle class="dot" cx="20" cy="27" r="6" fill="#22c55e"/>
      <text x="36" y="25" fill="#e0e7ff">Wi-Fi paired</text><text x="36" y="42" font-size="10" font-weight="500" fill="#a5b4fc">no cable needed</text>
    </g></g>
    <g class="c2"><g transform="translate(1020,120)">
      <rect width="140" height="64" rx="12" fill="#1e1b4b" stroke="#c084fc" stroke-opacity="0.7"/>
      <text x="14" y="26" fill="#e9d5ff">AI test run</text>
      <rect x="14" y="36" width="112" height="7" rx="3.5" fill="#312e81"/><rect class="badge" x="14" y="36" width="78" height="7" rx="3.5" fill="#a78bfa"/>
      <text x="14" y="58" font-size="10" font-weight="500" fill="#c4b5fd">12 pass · 1 fail</text>
    </g></g>
    <g class="c3"><g transform="translate(660,330)">
      <rect width="150" height="58" rx="12" fill="#1e1b4b" stroke="#f472b6" stroke-opacity="0.7"/>
      <text x="14" y="25" fill="#fce7f3">Report ready</text>
      <text x="14" y="44" font-size="10" font-weight="500" fill="#f9a8d4">PDF + DOCX, auto-saved</text>
    </g></g>
  </g>
</svg>
